<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsLearn - Learning Website</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Trebuchet MS",Arial,sans-serif;scroll-behavior:smooth}
body{min-width:320px}.app{min-height:100vh;background:var(--bg);color:var(--text);transition:.3s}
.light{--bg:#fffaf2;--card:#fff;--text:#303047;--muted:#777;--line:#eee4dc}
.dark{--bg:#20243a;--card:#303750;--text:#fff;--muted:#c4c8d6;--line:#515a70}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 7%;background:var(--card);box-shadow:0 3px 12px #0001;position:sticky;top:0;z-index:10}
header h2,footer h3{color:#ff9878}nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--text);font-weight:bold;font-size:14px}nav a:hover{color:#ff8c69}
button{cursor:pointer;border:0;border-radius:20px;padding:10px 16px;background:#ff9878;color:white;font-weight:bold}
main{max-width:1150px;margin:auto;padding:25px}
.hero{background:linear-gradient(120deg,#ffe1c6,#e6dcff);color:#343047;border-radius:22px;padding:50px 35px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero h1{font-size:35px;margin-bottom:15px}.hero h2{margin-bottom:12px}.hero p{line-height:1.7;max-width:520px}
.hero-image{font-size:75px;padding:10px}.start-btn{display:inline-block;margin-top:20px;background:#ff8c69;color:white;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
.stat-card{background:var(--card);text-align:center;padding:22px;border-radius:16px;box-shadow:0 3px 12px #0001}
.stat-card span{font-size:30px}.stat-card h3{color:#ff9878;font-size:27px;margin:8px}.stat-card p{color:var(--muted)}
.section-title{margin:35px 0 20px;font-size:25px}.subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.subject-card{background:var(--card);padding:23px 17px;border-radius:15px;text-align:center;box-shadow:0 3px 12px #0001;transition:.3s}
.subject-card:hover{transform:translateY(-7px)}.subject-icon{font-size:42px}.subject-card h3{margin:12px 0}
.subject-card p{color:var(--muted);font-size:14px;line-height:1.6;min-height:45px}.subject-card button{margin-top:15px}
.activities{background:var(--card);padding:25px;border-radius:18px;margin-top:35px}
.activity-form{display:flex;gap:10px;margin-bottom:20px}.activity-form input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;background:var(--bg);color:var(--text)}
.activity{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid var(--line)}
.activity label{display:flex;gap:12px;align-items:center}.activity input{accent-color:#ff9878;width:17px;height:17px}
.done{text-decoration:line-through;color:var(--muted)}.delete{background:none;color:#ed6262;font-size:18px;padding:5px 10px}
.progress{margin-top:25px}.progress-bar{height:13px;background:#ddd;border-radius:20px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff9878,#b18cff);transition:width .4s}
footer{text-align:center;padding:30px;margin-top:35px;background:var(--card);line-height:2;color:var(--muted)}
@media(max-width:750px){header{flex-wrap:wrap}.hero{flex-direction:column;text-align:center}.subject-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){main{padding:15px}.stats,.subject-grid{grid-template-columns:1fr}.activity-form{flex-direction:column}nav{gap:12px}.hero h1{font-size:27px}header{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;

function Header({theme,toggleTheme}){
 return <header><h2>📚 KidsLearn</h2><nav><a href="#home">Home</a><a href="#subjects">Subjects</a><a href="#activities">Activities</a></nav><button onClick={toggleTheme}>{theme==="light"?"🌙 Dark":"☀️ Light"}</button></header>;
}

function SubjectCard({icon,title,description,color}){
 return <div className="subject-card" style={{borderTop:`5px solid ${color}`}}>
  <span className="subject-icon">{icon}</span><h3>{title}</h3><p>{description}</p>
  <button onClick={()=>alert("Welcome to "+title+"!")}>Start Learning →</button>
 </div>;
}

function ActivityList({activities,toggleActivity,deleteActivity}){
 if(activities.length===0)return <p>No activities available. Add a new activity!</p>;
 return <div>{activities.map(item=><div className="activity" key={item.id}>
  <label><input type="checkbox" checked={item.completed} onChange={()=>toggleActivity(item.id)}/><span className={item.completed?"done":""}>{item.name}</span></label>
  <button className="delete" onClick={()=>deleteActivity(item.id)}>✕</button>
 </div>)}</div>;
}

function App(){
 const [theme,setTheme]=useState("light");
 const [input,setInput]=useState("");
 const [activities,setActivities]=useState([
  {id:1,name:"Learn English Alphabets",completed:true},
  {id:2,name:"Practice Mathematics",completed:false},
  {id:3,name:"Learn Science Facts",completed:false},
  {id:4,name:"Complete Drawing Activity",completed:false}
 ]);
 const addActivity=e=>{e.preventDefault();if(!input.trim())return;setActivities(old=>[...old,{id:Date.now(),name:input.trim(),completed:false}]);setInput("");};
 const toggleActivity=id=>setActivities(old=>old.map(item=>item.id===id?{...item,completed:!item.completed}:item));
 const deleteActivity=id=>setActivities(old=>old.filter(item=>item.id!==id));
 const completed=activities.filter(item=>item.completed).length;
 const progress=activities.length?completed/activities.length*100:0;
 return <div className={`app ${theme}`} id="home">
  <Header theme={theme} toggleTheme={()=>setTheme(t=>t==="light"?"dark":"light")}/>
  <main>
   <section className="hero"><div><h1>Welcome to KidsLearn! 🌈</h1><h2>Learn, Play and Grow Every Day!</h2>
    <p>Discover exciting lessons, fun games and creative activities. Let's make learning enjoyable!</p>
    <a href="#subjects" className="start-btn">Start Learning</a></div><div className="hero-image">📚 🎨 🧩</div></section>
   <section className="stats">
    <div className="stat-card"><span>📖</span><h3>4</h3><p>Subjects</p></div>
    <div className="stat-card"><span>⭐</span><h3>{completed}</h3><p>Activities Completed</p></div>
    <div className="stat-card"><span>📝</span><h3>{activities.length}</h3><p>Total Activities</p></div>
   </section>
   <section id="subjects"><h2 className="section-title">Explore Subjects</h2><div className="subject-grid">
    <SubjectCard icon="🔤" title="English" description="Learn alphabets, words and sentences." color="#ff8c69"/>
    <SubjectCard icon="➗" title="Mathematics" description="Explore numbers and simple calculations." color="#5b9cff"/>
    <SubjectCard icon="🔬" title="Science" description="Discover animals, plants and nature." color="#55c99a"/>
    <SubjectCard icon="🎨" title="Drawing" description="Improve creativity through art and colours." color="#b18cff"/>
   </div></section>
   <section id="activities" className="activities"><h2 className="section-title">My Learning Activities</h2>
    <form className="activity-form" onSubmit={addActivity}><input type="text" placeholder="Enter a new learning activity..." value={input} onChange={e=>setInput(e.target.value)}/><button type="submit">+ Add Activity</button></form>
    <ActivityList activities={activities} toggleActivity={toggleActivity} deleteActivity={deleteActivity}/>
    <div className="progress"><h3>Your Learning Progress</h3><div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}></div></div><p>{completed} out of {activities.length} activities completed!</p></div>
   </section>
  </main>
  <footer><h3>📚 KidsLearn</h3><p>Learning is fun when we learn together!</p><p>© 2026 KidsLearn. All Rights Reserved.</p></footer>
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
